[metadata]
name = fcitx5-plover
version = 0.1.0
description = fcitx5 keyboard control backend for Plover
keywords = plover plover_plugin fcitx5
license = GPL-3.0-or-later

[options]
zip_safe = True
python_requires = >=3.10
setup_requires =
	setuptools>=79.0.0
install_requires =
	plover>=5.4.0
packages =
	plover_fcitx5

[options.entry_points]
plover.linux.keyboard_capture =
	Fcitx5 = plover_fcitx5.keyboardcontrol_fcitx5:KeyboardCapture
plover.linux.keyboard_emulation =
	Fcitx5 = plover_fcitx5.keyboardcontrol_fcitx5:KeyboardEmulation
plover.bsd.keyboard_capture =
	Fcitx5 = plover_fcitx5.keyboardcontrol_fcitx5:KeyboardCapture
plover.bsd.keyboard_emulation =
	Fcitx5 = plover_fcitx5.keyboardcontrol_fcitx5:KeyboardEmulation
